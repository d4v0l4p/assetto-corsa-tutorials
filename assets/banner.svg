<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <!-- carbon weave -->
    <pattern id="carbon" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#0b0b0c"/>
      <rect width="8" height="8" fill="#151517"/>
      <rect x="8" y="8" width="8" height="8" fill="#151517"/>
      <rect width="8" height="2" fill="#1d1d20"/>
      <rect x="8" y="8" width="8" height="2" fill="#1d1d20"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- checkered flag -->
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0b0b0c"/>
      <rect width="20" height="20" fill="#f2f2f2"/>
      <rect x="20" y="20" width="20" height="20" fill="#f2f2f2"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="flagMask">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1280" height="320" fill="url(#carbon)"/>

  <!-- flag on the right, fading in -->
  <g mask="url(#flagMask)" opacity="0.55">
    <rect x="700" width="580" height="320" fill="url(#checker)" transform="skewX(-18) translate(100 0)"/>
  </g>
  <rect width="1280" height="320" fill="url(#shade)"/>

  <!-- speed lines -->
  <g transform="skewX(-18)">
    <rect x="128" y="60" width="380" height="6" fill="#e10600"/>
    <rect x="128" y="74" width="250" height="3" fill="#e10600" opacity="0.6"/>
    <rect x="128" y="254" width="520" height="4" fill="#ffffff" opacity="0.9"/>
    <rect x="128" y="264" width="300" height="2" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-style="italic">
    <text x="70" y="118" fill="#e10600" font-size="22" font-weight="800" letter-spacing="5">ASSETTO CORSA  ×  CUSTOM SHADERS PATCH</text>
    <text x="66" y="196" fill="#ffffff" font-size="74" font-weight="900" letter-spacing="1">MODDING TUTORIALS</text>
    <text x="70" y="236" fill="#a1a1aa" font-size="24" font-style="normal">Configs · Lights · Lua scripts · Apps · Tools</text>
  </g>

  <!-- red edge -->
  <rect y="314" width="1280" height="6" fill="#e10600"/>
</svg>
