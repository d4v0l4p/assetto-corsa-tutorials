<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <style>
      .col { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .card { fill: #21262d; stroke: #30363d; stroke-width: 1.5; }
      .title { fill: #ffffff; font-size: 22px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 15px; }
      .item { fill: #e6edf3; font-size: 17px; }
      .num { fill: #0d1117; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="16" fill="url(#bg)"/>

  <!-- column 1 -->
  <g transform="translate(30 30)">
    <rect class="col" width="280" height="380" rx="14"/>
    <rect width="280" height="6" rx="3" fill="#2ea44f"/>
    <text class="title" x="22" y="48">Start here</text>
    <text class="sub" x="22" y="72">Read these in order</text>
    <g transform="translate(18 96)">
      <rect class="card" width="244" height="52" rx="10"/><circle cx="28" cy="26" r="15" fill="#2ea44f"/><text class="num" x="28" y="31" text-anchor="middle">1</text><text class="item" x="54" y="32">Installing mods</text>
      <rect class="card" y="66" width="244" height="52" rx="10"/><circle cx="28" cy="92" r="15" fill="#2ea44f"/><text class="num" x="28" y="97" text-anchor="middle">2</text><text class="item" x="54" y="98">The car folder</text>
      <rect class="card" y="132" width="244" height="52" rx="10"/><circle cx="28" cy="158" r="15" fill="#2ea44f"/><text class="num" x="28" y="163" text-anchor="middle">3</text><text class="item" x="54" y="164">ext_config.ini basics</text>
      <rect class="card" y="198" width="244" height="52" rx="10"/><circle cx="28" cy="224" r="15" fill="#2ea44f"/><text class="num" x="28" y="229" text-anchor="middle">6</text><text class="item" x="54" y="230">Troubleshooting</text>
    </g>
  </g>

  <!-- arrows -->
  <path d="M312 220 L336 220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M622 220 L646 220" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M932 220 L956 220" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- column 2 -->
  <g transform="translate(340 30)">
    <rect class="col" width="280" height="380" rx="14"/>
    <rect width="280" height="6" rx="3" fill="#f59f00"/>
    <text class="title" x="22" y="48">Make it shine</text>
    <text class="sub" x="22" y="72">Lights, switches, effects</text>
    <g transform="translate(18 96)">
      <rect class="card" width="244" height="52" rx="10"/><circle cx="28" cy="26" r="15" fill="#f59f00"/><text class="num" x="28" y="31" text-anchor="middle">9</text><text class="item" x="54" y="32">Lights and emissives</text>
      <rect class="card" y="66" width="244" height="52" rx="10"/><circle cx="28" cy="92" r="15" fill="#f59f00"/><text class="num" x="28" y="97" text-anchor="middle">10</text><text class="item" x="54" y="98">Switches, animations</text>
      <rect class="card" y="132" width="244" height="52" rx="10"/><circle cx="28" cy="158" r="15" fill="#f59f00"/><text class="num" x="28" y="163" text-anchor="middle">11</text><text class="item" x="54" y="164">Exhaust flames</text>
      <rect class="card" y="198" width="244" height="52" rx="10"/><circle cx="28" cy="224" r="15" fill="#f59f00"/><text class="num" x="28" y="229" text-anchor="middle">12</text><text class="item" x="54" y="230">Advanced INIpp</text>
    </g>
  </g>

  <!-- column 3 -->
  <g transform="translate(650 30)">
    <rect class="col" width="280" height="380" rx="14"/>
    <rect width="280" height="6" rx="3" fill="#e8590c"/>
    <text class="title" x="22" y="48">Script it</text>
    <text class="sub" x="22" y="72">Lua in cars and apps</text>
    <g transform="translate(18 96)">
      <rect class="card" width="244" height="52" rx="10"/><circle cx="28" cy="26" r="15" fill="#e8590c"/><text class="num" x="28" y="31" text-anchor="middle">4</text><text class="item" x="54" y="32">Scriptable displays</text>
      <rect class="card" y="66" width="244" height="52" rx="10"/><circle cx="28" cy="92" r="15" fill="#e8590c"/><text class="num" x="28" y="97" text-anchor="middle">5</text><text class="item" x="54" y="98">Sounds and inputs</text>
      <rect class="card" y="132" width="244" height="52" rx="10"/><circle cx="28" cy="158" r="15" fill="#e8590c"/><text class="num" x="28" y="163" text-anchor="middle">13</text><text class="item" x="54" y="164">Lua apps</text>
      <rect class="card" y="198" width="244" height="52" rx="10"/><circle cx="28" cy="224" r="15" fill="#e8590c"/><text class="num" x="28" y="229" text-anchor="middle">14</text><text class="item" x="54" y="230">Parts and materials</text>
    </g>
  </g>

  <!-- column 4 -->
  <g transform="translate(960 30)">
    <rect class="col" width="290" height="380" rx="14"/>
    <rect width="290" height="6" rx="3" fill="#a371f7"/>
    <text class="title" x="22" y="48">Build it</text>
    <text class="sub" x="22" y="72">Modeling in Blender</text>
    <g transform="translate(18 96)">
      <rect class="card" width="254" height="52" rx="10"/><circle cx="28" cy="26" r="15" fill="#a371f7"/><text class="num" x="28" y="31" text-anchor="middle">7</text><text class="item" x="54" y="32">Animating doors</text>
      <rect class="card" y="66" width="254" height="52" rx="10"/><circle cx="28" cy="92" r="15" fill="#a371f7"/><text class="num" x="28" y="97" text-anchor="middle">8</text><text class="item" x="54" y="98">Quick UV seams</text>
      <text class="sub" x="4" y="164">+ video tutorials for LODs,</text>
      <text class="sub" x="4" y="186">colliders, baking and liveries</text>
    </g>
  </g>
</svg>
