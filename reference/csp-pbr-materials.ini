; ==================================================================================
; CSP COMPLETE PBR MATERIAL REFERENCE
; Covers: materials_carpaint.ini · materials_interior.ini · materials_glass.ini
; Source: ac-custom-shaders-patch/acc-extension-config (GitHub)
; ==================================================================================
;
; HOW TO USE
; ----------
; Add the relevant include at the top of your ext_config.ini:
;   [INCLUDE: common/materials_carpaint.ini]
;   [INCLUDE: common/materials_interior.ini]
;   [INCLUDE: common/materials_glass.ini]
;
; Then write any template block below. You only need to list properties you want
; to CHANGE from the defaults shown here. Unwritten properties keep their defaults.
;
; Target by material name from the kn5:    Materials = mat_name
; Target by mesh name:                     Meshes = GEO_MeshName
; Limit block to specific skins:           SKINS = skin_folder_1, skin_folder_2
; Apply to all skins (default):            SKINS = ?
;
; ==================================================================================
; RESOURCE / TEXTURE OVERRIDE SYSTEM
; Works inside any template or SHADER_REPLACEMENT block
; ==================================================================================
;
; Standard texture slot numbers:
;   0 = txDiffuse   1 = txNormal   2 = txMaps   3 = txDetail   4 = txNormalDetail
;
; Override with an external file next to your ext_config.ini:
;   RESOURCE_0 = txDiffuse
;   RESOURCE_FILE_0 = my_diffuse.dds
;
; Borrow a slot from the existing kn5 texture slots:
;   RESOURCE_REF_1 = txNormalDetail     ; e.g. reroute txNormalDetail into txNormal slot
;
; Reference a texture already loaded in the kn5 by filename:
;   RESOURCE_TEXTURE_0 = some_texture.dds
;
; Tint/multiply a slot color without a new texture file (R,G,B):
;   RESOURCE_COLOR_3 = 0.4, 0.0, 0.0   ; dark red tint on txDetail
;
; Inside PBR templates, use these shortcut properties instead of RESOURCE_ directly:
;   NormalTexture       = my_nm.dds     ; replaces txNormal slot
;   DiffuseTexture      = my_diff.dds   ; replaces txDiffuse slot (or R,G,B for flat color)
;   DetailTexture       = my_detail.dds ; replaces txDetail (or 1 = keep original kn5 texture)
;   DetailNormalTexture = my_dnm.dds    ; replaces txNormalDetail slot


; ==================================================================================
;  CARPAINT
;  Requires: [INCLUDE: common/materials_carpaint.ini]
;
;  Global defaults set on the [INCLUDE] line:
;    CarPaintMaterial = Carpaint        ; default material name targeted by all carpaint templates
;    CarPaintVersionAware = 1           ; set to 4 for newer auto-defaults, 9999 for always-latest
;                                       ; warning: at 9999 do not manually override reflectivity or
;                                       ; speculars — future updates may break the look
; ==================================================================================

; Material_CarPaint is the base all other carpaint templates extend.
; All parameters listed here are available on every carpaint template.
[Material_CarPaint]
Materials =                            ; material name(s) from the kn5, comma-separated. Or set CarPaintMaterial = in the INCLUDE line
UseDiffuseAlphaAsMask = 0             ; limit metallic/colored specular effects to areas where txDiffuse alpha is black. INVERT to flip
UseDiffuseAlphaAsClearCoatMask = 0    ; limit clear coat and sun specular to txDiffuse alpha areas. INVERT to flip
UseNormalsAlphaToMaskFlakes = 0       ; use txNormals alpha as a flake mask instead of the default damage mask
ClearCoatThickness = 0.0              ; how thick the clear coat is — thicker absorbs more light underneath, darkening the base color
ClearCoatTint = 0, 0, 0              ; RGB color that replaces the base paint color inside the clear coat layer
ClearCoatIOR = 1.0                    ; index of refraction for the clear coat — values above 1 make light absorption less angle-dependent
ClearCoatIntensity = 1.0              ; how strongly the clear coat contributes to the final color. 0 = disabled
ClearCoatSpecular = 0                 ; 0 = colored specular, 1 = white specular (physically correct), COLORED = tinted by ClearCoatTint. auto-set to 1 when CarPaintVersionAware >= 2
ClearCoatReflectionSharpness = 0      ; set to 1 to use the sun specular exponent for reflection sharpness — more physically correct clear coat
ColoredBlackSpecular = 0              ; set to 1 so colored specular also works on dark/unpainted areas — improves multi-color skins. auto-enabled when CarPaintVersionAware >= 4
FresnelMax = 0.8                      ; how reflective the surface is at glancing/grazing angles (0-1)
FresnelC = 0.16                       ; how reflective the surface is when facing the viewer directly (F0 value)
UseMetallicReflections = 0.0          ; forces reflections to be tinted by the base paint color — like gold or copper paint
FlakesK = 0.1                         ; controls metallic flake behavior. higher = more prominent flakes
BrightnessAdjustment = 1.0            ; multiplies overall paint brightness — useful when the car's AO map was baked for different settings
SpecularMult = 1.0                    ; global multiplier on all specular brightness values
ApplyTilingFix = 0                    ; set to 1 to reduce visible tiling repetition in txDetail (costs a texture read)
ApplyMatteFix = 0                     ; matte fix: txMaps-based matte no longer darkens the diffuse and also affects the clear coat. auto-enabled when CarPaintVersionAware >= 3
NormalsMode = DAMAGE                  ; how txNormals is used: DAMAGE = scratch/damage overlay, BASIC = always-on normal map
NormalizeAO = 0.0                     ; normalize AO from txDiffuse to blend better with vertex AO and reduce its effect on lights
BaseSpecularColor = 1, 1, 1          ; RGB tint of the specular highlight. white = neutral
ColoredSpecular = 0.0                 ; 0 = white specular highlight. 1 = specular tinted by the base paint color
PearlescentSpecular = 0.0             ; offsets the specular hue away from the base color — creates a pearl/color-shift effect
AmbientSpecular = 0.0                 ; brightness of the ambient specular — highlight from environment lighting with no direct light
AmbientSpecularEXP = 2.5             ; concentration of the ambient specular lobe — higher = smaller and sharper ambient highlight
SpecularBase = 0.5, 50                ; X = ambient specular brightness, Y = specular exponent (higher Y = tighter highlight)
SpecularSun = 2, 5000                 ; X = sun specular brightness, Y = sun specular exponent (higher Y = sharper sun reflection)
SecondaryReflection = 0               ; intensity of a second reflection layer for a double-layered look. auto-enabled in version 3+ when specular conditions are met
DiffuseSmoothness = 0, 0             ; use txDiffuse luminance as a smoothness map — X = min brightness value, Y = max brightness value
ForceCarPaintMode = 0                 ; force PBR car paint rendering mode. defaults to true for CarPaintVersionAware >= 2
StickersTexture =                     ; path to a UV2-mapped sticker overlay texture (requires UV2 on the mesh)
StickersMapsTexture =                 ; optional txMaps overlay for sticker areas — active where the sticker texture is opaque
StickersCoverDetails = 0              ; set to 1 to make the sticker texture render on top of txDetail
Skins =                               ; limit this block to specific skin folder names — e.g. Skins = Red, Blue. leave blank for all


; Standard flat/glossy solid-color paint. No metallic flakes or color shift.
[Material_CarPaint_Solid]
Materials =
FresnelMax = 0.5                      ; moderate reflectivity at glancing angles
FresnelC = 0.08                       ; low base reflectivity when facing the viewer
AmbientSpecular = 0.3                 ; gentle ambient highlight
SpecularBase = 0.2, 100              ; low brightness, tight specular highlight


; Standard metallic factory paint. Colored specular, ambient highlights, thin clear coat.
[Material_CarPaint_Metallic]
Materials =
FresnelMax = 1                        ; fully reflective at glancing angles
FresnelC = 0.1                        ; low base reflectivity when facing viewer
BrightnessAdjustment = 0.9            ; slightly darker base — compensates for ambient specular brightness
ColoredSpecular = 0.9                 ; specular highlight strongly tinted by the base paint color
AmbientSpecular = 0.6                 ; prominent ambient specular from environment
AmbientSpecularEXP = 2.5
ClearCoatThickness = 0.06             ; thin clear coat for subtle depth


; High-gloss chrome-effect paint. Very reflective, no clear coat.
[Material_CarPaint_Chrome]
Materials =
FresnelMax = 1
FresnelC = 0.4                        ; higher base reflectivity — chrome reflects even when facing the viewer directly
BrightnessAdjustment = 0.5            ; dark base color — reflections carry most of the visible brightness
ColoredSpecular = 0.9
AmbientSpecular = 0.0                 ; no ambient specular — chrome relies entirely on reflections
AmbientSpecularEXP = 2.5
ClearCoatThickness = 0.0              ; no clear coat


; Pearlescent paint. Hue-shifting specular highlight that differs from the base color.
[Material_CarPaint_Pearl]
Materials =
FresnelMax = 1
FresnelC = 0.1
BrightnessAdjustment = 0.9
PearlescentSpecular = 1.0             ; specular hue shifts away from the base color — the pearl effect
AmbientSpecular = 1.0
AmbientSpecularEXP = 3.0
ClearCoatThickness = 0.09
SpecularBase = 1, 50                  ; brighter, wider specular lobe


; Flat/matte paint. No clear coat, very wide soft specular, no sun highlight.
[Material_CarPaint_Matte]
Materials =
FresnelMax = 1
FresnelC = 0.1
AmbientSpecular = 1.0
AmbientSpecularEXP = 4.0             ; tight but dim ambient highlight
SpecularBase = 0.3, 5                 ; very wide, low specular — almost diffuse-like
SpecularSun = 0, 1                    ; no sun specular


; Weathered/bumpy old paint with procedural surface noise added to normals.
[Material_CarPaint_Old]
Materials =
NormalsNoise = 0.01                   ; amplitude of procedural normal noise — simulates a rough, uneven surface
NormalsNoiseUV = 80                   ; UV frequency of the normal noise — higher = finer noise pattern
FresnelMax = 0.4
FresnelC = 0.04
AmbientSpecular = 1
SpecularBase = 0.4, 40
SpecularSun = 0.5, 1000


; Highly metallic paint. Gold, copper, heavily metallic finishes.
; Extends Material_CarPaint_Metallic.
[Material_CarPaint_Metal]
Materials =
UseMetallicReflections = 1            ; tints reflections by the base paint color — creates gold/copper-like look
FresnelMax = 1
FresnelC = 1                          ; fully reflective even when facing the viewer directly
FlakesK = 1                           ; maximum metallic flake intensity
ClearCoatThickness = 0.2
ColoredSpecular = 1.0
AmbientSpecular = 0.5
BrightnessAdjustment = 0.2            ; very dark base — reflections and specular provide most of the visible brightness


; Color-shifting paint that changes hue based on viewing angle.
; Extends Material_CarPaint_Metallic.
[Material_CarPaint_Chameleon]
Materials =
ChameleonColorA = #33007f, 0.5        ; first alternative color (hex) and its opacity (0-1)
ChameleonColorB = #ffff00, 1          ; second alternative color and its opacity
ChameleonExponent = 1.2              ; controls how colors scale with angle — higher = more of second color visible
ChameleonCenter = 0.45               ; transition center point — higher = more of the first color visible
UseDiffuseAlphaAsChameleonMask = 0    ; set to 1 to restrict chameleon effect to txDiffuse alpha areas. INVERT to flip


; ChromaFlair / flip-flop paint using a gradient texture for angle-based color shifting.
; X axis of the texture = viewing angle, Y axis = lighting angle.
; Example texture: https://files.acstuff.club/V70m/tex.dds
; Extends Material_CarPaint.
[Material_CarPaint_ChromaFlair]
Materials =
CarPaintVersionAware = 4              ; requires version 4 defaults
GradientTexture =                     ; path to your gradient .dds texture — required for the effect to work
ChromaFlairFlakesBase = 0.5           ; brightness of the specular/reflective component in areas without flakes
UseDiffuseAlphaAsChromaFlairMask = 0  ; set to 1 to restrict ChromaFlair to txDiffuse alpha areas. INVERT to flip
ApplyTilingFix = 1                    ; recommended — heavy flake detail benefits from tiling fix
ClearCoatReflectionSharpness = 1      ; keeps reflections sharp while still highlighting the color-flip effect


; Psychedelic rainbow chrome vinyl wrap effect. Experimental — avoid changing values unless you know what you're doing.
; Reference image: https://i.imgur.com/yOUQVjW.png
; Extends Material_CarPaint_Chameleon.
[Material_CarPaint_RainbowChrome]
Materials =
ChromeRainbowFlip = 0                 ; set to 1 to flip the rainbow color direction
ChromeRainbowNegate = 1              ; set to 1 to invert/negate all rainbow colors
ChromeRainbowFocus = 1                ; compactness of the rainbow spread — higher = tighter color bands
ChromeRainbowMult = 1                 ; overall strength multiplier for the rainbow effect
UseDiffuseAlphaAsRainbowMask = 0      ; set to 1 to apply rainbow only where txDiffuse alpha is black. INVERT to flip
ChameleonColorA = 0, 0               ; chameleon disabled by default in this template
ChameleonColorB = 0, 0
ChameleonExponent = 1
ChameleonCenter = 0.5


; Experimental anisotropic Ward rainbow specular paint. Avoid changing values unless you know what you're doing.
; Reference image: https://i.imgur.com/dI32nOK.png
; Extends Material_CarPaint_Chameleon.
[Material_CarPaint_Rainbow]
Materials =
ChromeRainbowFlip = 0                 ; set to 1 to flip the rainbow direction
ChromeRainbowNegate = 0              ; set to 1 to negate/invert the rainbow colors
RainbowIntensity = 0.7                ; overall intensity of the rainbow iridescent effect
AnisotropicIntensity = 0.0            ; brightness of plain white anisotropic specular layered on top of the rainbow
AnisotropicAmount = 0.9              ; how directionally anisotropic the surface is — 0 = isotropic, 1 = fully directional
Gloss = 0.7                           ; gloss value used in the anisotropy calculation
BrightnessAdjustment = 0.8
UseDiffuseAlphaAsRainbowMask = 0      ; set to 1 to apply rainbow only where txDiffuse alpha is black
ChameleonColorA = 0, 0               ; chameleon disabled by default
ChameleonColorB = 0, 0
ChameleonExponent = 1
ChameleonCenter = 0.5


; ==================================================================================
;  INTERIOR PBR
;  Requires: [INCLUDE: common/materials_interior.ini]
;
;  Global default:
;    DisableDev = 1   ; disables legacy dev materials from dev_materials_interior.ini
;                     ; that might be accidentally included with older configs
; ==================================================================================

; Material_InteriorPBR is the base all interior PBR templates extend.
; Used for ksPerPixelMultiMap and ksPerPixelMultiMap_NMDetail based materials.
; Expected in Kunos style: occlusion map in txDiffuse, color in txDetail.
; If your material uses a different layout, change OcclusionSource and ColorSource.
; All parameters listed here are available on every interior PBR template.
[Material_InteriorPBR]
Materials =
HasDetailNormals = 1                  ; set to 0 for meshes using ksPerPixelMultiMap shader (no txNormalDetail slot)
UseClearCoat = 0                      ; set to 1 to add a clear coat layer over the material
ClearCoatSmoothness = 1.0             ; glossiness of the clear coat surface (0 = rough, 1 = mirror smooth)
ClearCoatIntensity = 1.0              ; strength of the clear coat — 0 effectively disables it
ClearCoatNormalsShare = 0.0           ; how much of txNormalDetail is also applied to the clear coat layer for micro-detail
ClearCoatF0 = 0.04                    ; base reflectivity (F0) of the clear coat. 0.04 = standard dielectric, 0.35 = tinted/filmed
ClearCoatThickness = 0.0              ; thickness of the clear coat for light absorption underneath
ClearCoatIOR = 1.5                    ; index of refraction of the clear coat layer
ColorSource = DIFFUSE_NORMALIZED      ; where to read the surface color from: DIFFUSE = raw, DIFFUSE_NORMALIZED = normalize brightness, FORCE_WHITE = ignore color use white, DESATURATE = greyscale
OcclusionSource = LUMINANCE           ; where to read ambient occlusion from: NONE = off, LUMINANCE = from txDiffuse brightness (Kunos standard), MAPS_ALPHA = from txMaps alpha channel
OcclusionMult = 1.0                   ; multiplier on the occlusion intensity — lower to reduce dark creases
OcclusionMap = 0, 1                   ; min/max remap range for the AO value — shift min above 0 to lighten very dark areas
Smoothness = 0.9                      ; surface glossiness before texture scaling (0 = fully rough, 1 = mirror smooth)
Metalness = 0                         ; metallic factor before texture scaling (0 = dielectric/non-metal, 1 = fully metallic)
Reflectance = 0.04                    ; base reflectivity F0 before texture scaling — 0.04 = standard plastic/rubber
SmoothnessMap = 1, 1                  ; min/max remap range for smoothness from green channel of txMaps
MetalnessMap = 1, 1                   ; min/max remap range for metalness from red channel of txMaps
ReflectanceMap = 1, 1                 ; min/max remap range for reflectance from blue channel of txMaps
Brightness =                          ; direct brightness multiplier on the whole material
BrightnessAdjustment =                ; same as Brightness — alternative name accepted by the template
CubemapReflectionBlur = 0            ; how much to blur the environment/cubemap reflection — 0 = sharp chrome, 1 = satin/matte
ApplyTilingFix = 0                    ; set to 1 to reduce visible tiling artifacts in the detail texture (costs extra texture reads)
ApplyShadowBiasFix = 0                ; set to 1 to fix shadow acne on interior geometry
ShadowBiasFixStrength = 1.0           ; controls how strongly the shadow bias fix is applied when ApplyShadowBiasFix = 1
ExtraSharpLocalReflections = 0        ; increase toward 1 to sharpen screen-space local reflections on this surface
LocalReflectionsSharpness = 0.001     ; alternative local reflection sharpness value — use instead of or alongside ExtraSharpLocalReflections
LocalReflectionsForce = 1             ; set to 0 to not force local reflections regardless of global scene settings
DetailScale = 30                      ; UV tiling scale multiplier for txDetail and txNormalDetail
DetailTextureBlur = 0                 ; blur txDetail to use only its color — hides its visible pattern (for PBR-format detail textures)
DetailNormalBlend = 0                 ; strength of the detail normal map — negative value flips the height direction
DetailNormalPBRFormat = 0             ; set to 1: blue channel of txNormalDetail = occlusion map, alpha = specular variation
DetailNormalPBRSecondaryColor = 0, 0, 0, 0 ; R,G,B,strength — color tint applied in areas occluded by the detail normal, adds depth to grooves
DetailNormalPBRReflectance = 1        ; how strongly the detail normal's occlusion reduces reflectance in recessed areas
DetailNormalPBRSmoothness = 1         ; how strongly the detail normal's alpha channel modifies glossiness
DetailNormalPBRMetalness = 1          ; how strongly the txDetail alpha channel drives metalness variation across the surface
DetailNormalPBRSmoothnessGamma = 1    ; gamma correction on the gloss value from detail normal alpha — increase for more contrast
AmbientSpecular = 0.0                 ; brightness of the ambient specular highlight from environment lighting
AmbientSpecularEXP = 2.5             ; concentration of the ambient specular lobe — higher = smaller and sharper highlight
UseClothShading = 0                   ; set to 1 to use the cloth/velvet shading model instead of standard PBR
ClothSheenColor = 1, 1, 1            ; RGB color of the cloth sheen/rim highlight visible on fabric edges
ClothSubsurfaceColor = 0, 0, 0       ; RGB color of cloth subsurface scattering — appears as a backlit color tint
ForceDetailEverywhere = 0             ; set to 1 to apply txDetail even in areas where txDiffuse would normally suppress it
StickersTexture =                     ; path to a UV2-mapped sticker overlay texture (requires UV2 on the mesh)
StickersMapsTexture =                 ; optional txMaps overlay active where the sticker is opaque — overrides PBR maps
StickersCoverDetails = 0              ; set to 1 to make the sticker texture render on top of txDetail
DiffuseAsAO =                         ; when set, ColorSource becomes FORCE_WHITE and this value is used as OcclusionMult — treats txDiffuse purely as AO
NormalTexture =                       ; path to a replacement txNormal map
DiffuseTexture =                      ; path to a replacement txDiffuse texture, or R,G,B for a flat color
DetailTexture =                       ; path to a replacement txDetail texture, or 1 to keep the original kn5 texture
DetailNormalTexture =                 ; path to a replacement txNormalDetail texture


; Explicit v2 base with detail normals always active.
; All _v2 templates extend this. Use directly for full PBR control with no preset look.
; All Material_InteriorPBR parameters above also apply here.
[Material_InteriorPBRDetail]
Materials =
Smoothness = 0                        ; starts at 0 — set your own value
Reflectance = 0.04
HasDetailNormals = 1
DetailScale = 30
DetailNormalBlend = -1.0              ; negative by default to match the orientation of the built-in PBR detail normal textures
DetailNormalIntensity = 1.0           ; extra multiplier on top of DetailNormalBlend — lets you scale blend and intensity separately
DetailNormalPBRFormat = 1             ; PBR format active: blue = occlusion, alpha = specular
DetailNormalPBRReflectance = 0.5
ColorSource = DIFFUSE_NORMALIZED
DiffuseAsAO =                         ; when set, ColorSource becomes FORCE_WHITE and value is used as OcclusionMult


; Legacy v1 — simple metal, no detail normals, no v2 PBR features
[Material_Metal]
Materials =
Smoothness = 0.95                     ; very smooth, glossy surface
Metalness = 0.9                       ; nearly fully metallic — specular tinted by the base color
Reflectance = 0.0                     ; metalness handles reflectivity — dielectric F0 is irrelevant at this metalness level
BrightnessAdjustment = 2              ; boosted brightness to compensate for metallic energy conservation darkening
CubemapReflectionBlur = 1             ; fully blurred envmap reflection — satin metal look. lower toward 0 for sharper chrome


; Legacy v1 — simple chrome, no detail normals, no v2 PBR features
[Material_Chrome]
Materials =
Smoothness = 0.95
Metalness = 0.85
Reflectance = 0.0
BrightnessAdjustment = 1
CubemapReflectionBlur = 1             ; lower toward 0 for sharper mirror chrome


; Legacy v1 — simple plastic
[Material_Plastic]
Materials =
Smoothness = 0.7                      ; glossy plastic surface
Reflectance = 0.04                    ; standard dielectric reflectivity


; Legacy v1 — simple leather
[Material_Leather]
Materials =
Smoothness = 0.65                     ; semi-smooth leather sheen
Reflectance = 0.03


; Legacy v1 — dashboard leather, nearly matte
[Material_DashboardLeather]
Materials =
Smoothness = 0.01                     ; almost fully matte — worn dashboard texture
Reflectance = 0.02


; Legacy v1 — simple fabric, fully matte
[Material_Fabric]
Materials =
Smoothness = 0.0
Reflectance = 0.02


; Legacy v1 — simple carpet, fully matte with shifted AO
[Material_Carpet]
Materials =
Smoothness = 0.0
OcclusionMap = -0.1, 1                ; shifted AO range so carpet grooves appear lighter instead of very dark


; Legacy v1 — simple velvet, fully matte
[Material_Velvet]
Materials =
Smoothness = 0.0
Reflectance = 0.04


; Obsolete — use Material_Leather_v2 instead
[Material_LeatherDetailed]
Materials =
Smoothness = 0
Reflectance = 0.02
HasDetailNormals = 1
DetailNormalBlend = 0.8
DetailScale = 40
DetailNormalPBRFormat = 1
DetailNormalTexture = common/pbr_leather_spotty.dds
DetailNormalPBRSecondaryColor = 0, 0, 0, 0.1
DetailNormalPBRReflectance = 0.5


; Carbon fiber with built-in weave textures and clear coat. Extends Material_InteriorPBR.
[Material_Carbon]
Materials =
HasDetailNormals = 1
Smoothness = 0.5
Reflectance = 0.2
CubemapReflectionBlur = 0.35          ; slightly blurred reflections — lacquered carbon look
UseClearCoat = 1
ClearCoatSmoothness = 0.9
ClearCoatIntensity = 1.0
DetailTexture = common/carbon.png     ; built-in carbon weave color/diffuse texture
DetailNormalTexture = common/carbon_nm.png ; built-in carbon weave normal map
DetailNormalBlend = 1
DetailScale = 420                     ; tight tiling to match real carbon weave scale


; v2 metallic surface with brushed metal detail normals. Extends Material_Aluminium_v2.
[Material_Metal_v2]
Materials =
Metalness = 0.8                       ; strong metallic
Reflectance = 1
BrightnessAdjustment = 0.8
DetailTexture = 1                     ; keep original kn5 txDetail
DetailNormalTexture = common/pbr_metal.dds ; built-in brushed/grainy metal normal map
DetailNormalPBRSecondaryColor = 0, 0, 0, 0
DetailScale = 30
DetailNormalBlend = 1
DetailNormalPBRSmoothnessGamma = 2    ; higher = more gloss contrast from the normal map
LocalReflectionsSharpness = 1         ; sharp screen-space local reflections


; v2 aluminium with brushed metal detail normals. All v2 material templates extend this.
[Material_Aluminium_v2]
Materials =
Metalness = 0.4                       ; partially metallic aluminium
Reflectance = 1
BrightnessAdjustment = 0.5
DetailTexture = 1                     ; keep original kn5 txDetail
DetailNormalTexture = common/pbr_metal.dds
DetailNormalPBRSecondaryColor = 0, 0, 0, 0
DetailScale = 30
DetailNormalBlend = 1
DetailNormalPBRSmoothnessGamma = 2


; v2 aged/oxidised aluminium — lower metalness and reflectance, darker. Extends Material_Aluminium_v2.
[Material_AluminiumOld_v2]
Materials =
Metalness = 0.2                       ; low metalness — dull oxidised surface
Reflectance = 0.2                     ; reduced reflectance — aged look
Brightness = 0.5                      ; darker overall


; v2 rusty/tarnished old metal — very low reflectance, no sharp local reflections. Extends Material_Aluminium_v2.
[Material_MetalOld_v2]
Materials =
Metalness = 0.8
Reflectance = 0.0                     ; nearly zero reflectance — rusty, oxidised surface
Brightness = 0.3                      ; dark, tarnished surface
DetailNormalPBRSmoothnessGamma = 1
LocalReflectionsSharpness = 0         ; no sharp local reflections for old rough metal


; v2 plastic with micro surface detail normals. Extends Material_InteriorPBRDetail.
[Material_Plastic_v2]
Materials =
Reflectance = 0.04
DetailNormalPBRSecondaryColor = 0, 0, 0, 0.5 ; slight dark tint in plastic grain grooves
DetailNormalBlend = 0.5
DetailNormalTexture = common/pbr_plastic.dds  ; subtle plastic surface grain normal map
DetailNormalPBRSmoothnessGamma = 1
DetailTextureBlur = 1                 ; blur txDetail — use only its color, not its visible texture pattern


; v2 bumpy leather grain. Texture has flipped NM height so DetailNormalBlend is negative.
; Extends Material_InteriorPBRDetail.
[Material_Leather_v2]
Materials =
Reflectance = 0.04
DetailNormalTexture = common/pbr_leather_bumpy.dds ; bumpy leather grain normal map
DetailNormalIntensity = 3             ; strong grain depth
DetailNormalPBRSecondaryColor = 1, 1, 1, 0.08 ; subtle white highlight in leather grain creases
DetailNormalBlend = -1                ; negative because this texture has a flipped height direction


; v2 pored/dotted leather grain. Extends Material_InteriorPBRDetail.
[Material_LeatherSpotty_v2]
Materials =
Reflectance = 0.03
DetailNormalTexture = common/pbr_leather_spotty.dds ; pored/dotted leather pattern normal map
DetailNormalPBRSecondaryColor = 0, 0, 0, 0.1 ; subtle dark tint inside the pore holes


; v2 stitched/poked leather. Extends Material_InteriorPBRDetail.
[Material_LeatherPoked_v2]
Materials =
Reflectance = 0.04
DetailNormalTexture = common/pbr_leather_pattern.dds ; stitched/poked leather pattern normal map
DetailNormalIntensity = 2
DetailNormalPBRSecondaryColor = 0, 0, 0, 10  ; strong dark tint inside the poke holes
DetailNormalPBRReflectance = 10              ; high reflectance contrast on the pattern edge ridges


; v2 fabric with cloth shading model. Extends Material_InteriorPBRDetail.
[Material_Fabric_v2]
Materials =
Reflectance = 0.4                     ; higher than expected — cloth shading model compensates for this
DetailNormalTexture = common/pbr_fabric.dds
DetailNormalPBRSecondaryColor = 0, 0, 0, 0.3
UseClothShading = 1                   ; activates the cloth/velvet shading model for soft rim lighting on fabric edges
ClothSheenColor = 1, 1, 1            ; color of the sheen/rim highlight on cloth edges


; v2 velvet with cloth shading and carpet normal texture. Extends Material_InteriorPBRDetail.
[Material_Velvet_v2]
Materials =
DetailNormalTexture = common/pbr_carpet.dds
DetailNormalPBRSecondaryColor = 0, 0, 0, 0
UseClothShading = 1
Reflectance = 0.5
DetailScale = 40
ClothSheenColor = 1, 1, 1


; v2 carpet. Extends Material_InteriorPBRDetail.
[Material_Carpet_v2]
Materials =
Reflectance = 0.04
DetailNormalTexture = common/pbr_carpet.dds
DetailNormalPBRSecondaryColor = 0, 0, 0, 1 ; strong dark tint in carpet fiber grooves


; Shell-based fur shader. Renders the mesh multiple times in layered shells to simulate
; fiber/pile depth. Good for alcantara, suede, velvet, short-pile carpet.
[Material_Fur]
Materials =
FurLayers = 6                         ; number of shell rendering passes — more = better quality but more expensive to render
FurScale = 1                          ; overall fiber depth/height scale — controls how tall the fibers appear
FurFacingScale = 0.5                  ; reduces fiber depth on surfaces facing the camera directly — prevents flat look on front-facing areas
FurGravityFactor = 1                  ; how much fiber tips droop downward — 0 = straight up, 1 = fully pulled down by gravity
FurUseTextures = 1                    ; 1 = use alpha from txMaps and txNormalDetail as fiber height maps for per-pixel variation
FurUseDetailAlpha = 0                 ; set to 1 to use txDetail alpha for fiber height instead of txNormalDetail alpha
FurFidelityScale = 1                  ; scale of the procedural noise added on top of height maps — set to 0 to disable noise
FurOcclusion = 0.5                    ; brightness of the root/lower areas — lower = darker roots, more visible depth contrast
FurRimExponent = 3                    ; controls rim lighting on surfaces facing the viewer — higher = less rim on flat-facing areas
FurAmbient = 1                        ; brightness of rim/ambient lighting. both vertex AO and txMaps red channel are factored in
FurDiffuse = 1                        ; brightness from sun and extra lights — controls the backlit/subsurface look
ThresholdExponent = 0.8              ; alters the overall fur density and fiber thresholding curve
ThresholdMultipler = 0.8             ; multiplier on the threshold — adjust to increase or reduce visible fiber density


; LCD instrument screen shader. Simulates pixel grid, viewing angle color shift
; and display panel type characteristics (TN / IPS / VA / IDEAL).
[Material_DigitalScreen]
Materials =
MatrixType = IPS                      ; display panel type: TN = strong angle color shift, IPS = mild shift, VA = medium shift, IDEAL = no shift
UseTextureCoordinates = 1             ; 1 = use UV coordinates for pixel grid. 0 = use vertex position (sometimes better for curved screens)
ScreenScale = 480                     ; horizontal pixel count — higher = finer/denser pixel grid
ScreenAspectRatio = 0.25             ; height divided by width of the screen area — used to correctly shape pixel grid cells
Emissive = 4                          ; screen brightness/emissive intensity — how bright the screen glows
FlipXY = 0                            ; set to 1 to rotate the display 90 degrees
SkewTextureCoordinates = 0            ; offset to correct tilted or skewed UV coordinates on the screen mesh
TreatTextureAsHDR = 0                 ; set to 1 if the input screen texture is in HDR format


; Alternative screen approach — cover the instrument mesh with a glass piece using
; multiplicative blending to filter what is behind it. Start with a white txDiffuse.
; Note: shading on this piece may not look great. Consider using Material_DigitalScreen directly.
[Material_DigitalScreen_GlassOverlay]
Materials =
MatrixType = IPS                      ; panel type: TN, IPS, VA, IDEAL — same as Material_DigitalScreen
UseTextureCoordinates = 1             ; 1 = UV coords for pixel grid, 0 = vertex position
ScreenScale = 480                     ; horizontal pixel count
ScreenAspectRatio = 0.25             ; height divided by width of the screen area
FlipXY = 0                            ; set to 1 to rotate 90 degrees


; Windscreen/HUD decal projected onto a windscreen mesh. Renders as a transparent sticker overlay.
[Material_WindscreenBanner]
Materials =
BlurBackground = 0                    ; increase to blur objects behind the banner — creates a rough/frosted transparency look
RainDrops = 1                         ; set to 0 if this mesh overlays an interior windscreen to avoid duplicating rain drop effects in both layers
WindscreenMesh =                      ; name of the windscreen mesh this banner overlays — fixes rendering order and depth
Brightness =                          ; optional brightness multiplier for the whole banner
CastShadowsThreshold =                ; alpha value above which the banner casts shadows — e.g. 0.99 to shadow only fully opaque areas
MaskPass = 0.5                        ; opacity of the secondary mask/tint pass rendered over the banner (0 = off, 1 = full opacity)
MaskPassColor = 0, 0, 0              ; RGB color of the mask tint pass — e.g. 0.1, 0.05, 0 for a warm amber window tint
MaskPassBoostColor =                  ; optional HDR color multiplier applied to MaskPassColor for brighter tinting
MaskPassOpacityClip =                 ; alpha clip threshold for the mask pass. auto-set to 0.5 when WindscreenMode is active
ColorfulShadowing = 2                 ; opacity/strength of colored shadows cast by this banner mesh onto the car interior
ColorfulShadowingBoostColor =         ; optional HDR boost multiplier on the colorful shadow color
ColorfulShadowingOpacityClip =        ; alpha clip threshold for colorful shadows. auto-set to 0.5 in WindscreenMode


; ==================================================================================
;  GLASS
;  Requires: [INCLUDE: common/materials_glass.ini]
;
;  Shortcut presets — set on the [INCLUDE] line, no extra block needed:
;    ExteriorGlassMaterials            = mat   ; standard plain glass (IOR 1.5)
;    ExteriorGlassMeshes               = mesh
;    ExteriorGlassTintedMaterials      = mat   ; dark tinted windows (FilmIOR 3.2, ThicknessMult 3)
;    ExteriorGlassTintedMeshes         = mesh
;    ExteriorGlassFilmedMaterials      = mat   ; filmed/coated glass (FilmIOR 2.4, ThicknessMult 1)
;    ExteriorGlassFilmedMeshes         = mesh
;    ExteriorGlassHeadlightsMaterials  = mat   ; headlight cover (FilmIOR 2.2)
;    ExteriorGlassHeadlightsMeshes     = mesh
;    ExteriorGlassPhotoelasticMaterials = mat  ; iridescent glass
;    ExteriorGlassPhotoelasticMeshes   = mesh
;
;  Common IOR / FilmIOR presets:
;    Plain glass:       IOR = 1.5  FilmIOR = 1.5  ThicknessMult = 1
;    Filmed/coated:     IOR = 1.5  FilmIOR = 2.4  ThicknessMult = 1
;    Tinted windows:    IOR = 1.5  FilmIOR = 3.2  ThicknessMult = 3
;    Headlight cover:   IOR = 1.5  FilmIOR = 2.2
;    Strong iridescent: IOR = 1.5  FilmIOR = 3.5
; ==================================================================================

; Standard PBR glass shader
[Material_Glass]
Materials =
IOR = 1.5                             ; index of refraction — 1.5 = standard glass. higher = more reflective surface
FilmIOR = 1.5                         ; IOR of the surface film/coating layer — raise for tinted or filmed effects (2.2 to 3.5)
ThicknessMult = 1.0                   ; glass thickness multiplier — thicker glass absorbs more light, making it darker
ProfileFix = 0.04                     ; adds virtual extra thickness at glancing angles to prevent thin-edge visual artifacts
BrightnessAdjustment =                ; optional overall brightness multiplier for the glass surface
ExtraLightsAdjustment = 0.03          ; brightness of lights or emissive objects showing through or behind the glass
UseNormalMap = 0                      ; set to 1 to apply a regular txNormal normal map on the glass surface
UseNormalMapWithAlpha = 0             ; set to 1 if the normal map also contains an alpha channel (ksPerPixelNM style)
NormalMapUVMult = 1                   ; UV scale multiplier for the normal map — increase to tile it more finely
Refraction = 0                        ; enables cheap refraction — non-zero activates it, higher = more light bending
RefractionBias = 0                    ; blurs the refraction — increase for frosted or glass-side effects
RefractionRainbow = 0                 ; adds chromatic aberration/rainbow dispersion to refraction. potentially expensive
RefractionMatte = 0                   ; set to 1 for fully frosted/matte glass — uses RefractionBias for the blur amount
MaskPass = 0                          ; opacity of a secondary tint pass rendered over the glass (0 = off, 1 = full)
MaskPassColor = 0, 0, 0              ; RGB color for the mask tint — e.g. 0.0, 0.1, 0.05 for green-tinted glass
Desaturate = 0                        ; desaturates the base diffuse shading and pushes that color to the mask pass instead


; Glass side/edge — fully transparent body with maximum refraction blur.
; Extends Material_Glass.
[Material_GlassSide]
Materials =
ThicknessMult = 0                     ; fully transparent — no light absorption
ExtraLightsAdjustment = 2             ; bright backlit/transmission effect on the edge
BrightnessAdjustment = 1
Refraction = 1                        ; full refraction enabled
RefractionBias = 1                    ; maximum blur — completely diffused/frosted edge


; Emissive glass for tail lights, brake lights, and indicator lenses.
; Uses smGlass_emissive shader. Extends Material_Glass.
[Material_MultiEmissiveGlass]
Materials =
IOR = 1.5
FilmIOR = 2.0                         ; moderate film coating suitable for light lenses
ThicknessMult = 1.0
ProfileFix = 0.1                      ; slightly thicker edge to avoid artifacts on lens geometry
BrightnessAdjustment = 0.6            ; dim the glass surface slightly so the emissive glow stands out clearly
UseNormalMapWithAlpha = 0             ; set to 1 if using a normal map with alpha channel
IS_TRANSPARENT = 1                    ; set to 0 to render the lens as a fully opaque solid element


; Iridescent glass — simulates stress birefringence color patterns found in headlight
; glass and windscreens. Uses procedural Perlin noise instead of a texture.
; Extends Material_Glass.
[Material_PhotoelasticGlass]
Materials =
IOR = 1.5
FilmIOR = 3.2                         ; high film IOR produces strong iridescent rainbow bands
ThicknessMult = 1.0
ProfileFix = 0.08                     ; slightly thicker edge fix for glancing angle geometry
PhotoelasticityMult = 0.5             ; overall iridescence intensity — keep low (0.2–0.5). too high looks bad
PhotoelasticityBaseScale = 8          ; global scale of the iridescent pattern — higher = larger visible features
PhotoelasticityNoiseScale = 0.04      ; randomization depth — deeply affects the output, change very carefully
PhotoelasticitySpotsScale = 0.5       ; scale of spots that limit where the effect appears on the mesh surface
PhotoelasticitySpotsOffset = 0.1      ; positional offset of the spots — helps fit the effect to the mesh shape
PhotoelasticityStripesScale = 4       ; number of visible color stripe bands across the glass surface
ExtraLightsAdjustment = 0.4           ; brightness of lights behind or inside the glass
UseNormalMapWithAlpha = 0             ; set to 1 if using a normal map with alpha channel


; ==================================================================================
;  SHADER_REPLACEMENT — manual direct shader property override
;  Use for materials not covered by PBR templates, or to tweak props on a shader
;  without switching it entirely.
; ==================================================================================

[SHADER_REPLACEMENT_...]
MATERIALS = your_material_name        ; material name(s) from the kn5
; MESHES = GEO_MeshName              ; OR target by mesh name instead
; SHADER = ksPerPixelMultiMap_NMDetail ; optionally override the shader entirely

; Texture overrides — same slot numbers as the RESOURCE_ system above
; RESOURCE_0 = txDiffuse
; RESOURCE_FILE_0 = custom_diffuse.dds
; RESOURCE_1 = txNormal
; RESOURCE_FILE_1 = custom_nm.dds
; RESOURCE_3 = txDetail
; RESOURCE_COLOR_3 = 0.4, 0.0, 0.0   ; tint the detail slot without a new file

PROP_... = ksDiffuse, 0.5             ; diffuse lighting multiplier — overall brightness of the surface in diffuse light
PROP_... = ksAmbient, 0.4            ; ambient lighting multiplier — how much bounce/ambient light the surface picks up
PROP_... = ksSpecular, 1.0           ; specular highlight brightness
PROP_... = ksSpecularEXP, 50         ; specular exponent — higher = smaller, tighter specular highlight
PROP_... = fresnelC, 0.05            ; base Fresnel reflectivity when facing the viewer (F0)
PROP_... = fresnelMaxLevel, 0.8      ; maximum Fresnel reflectivity at glancing angles
PROP_... = fresnelEXP, 5             ; Fresnel falloff exponent — higher = faster transition from edge to center
PROP_... = isAdditive, 2             ; set to 2 to enable car-paint-style PBR rendering mode on ksPerPixelMultiMap
PROP_... = detailUVMultiplier, 100   ; UV tiling scale multiplier for the txDetail texture slot
PROP_... = sunSpecular, 10           ; sun/directional light specular brightness
PROP_... = sunSpecularEXP, 1500      ; sun specular exponent — higher = sharper, more focused sun reflection
PROP_... = useDetail, 1              ; enables the txDetail texture slot on shaders that need this flag set explicitly
PROP_... = extExtraSharpLocalReflections, -0.001 ; positive = sharper local reflections, negative = force sharpening mode

CAST_SHADOWS = 1                      ; enable shadow casting for this material
DOUBLE_FACE_SHADOW_BIASED = 1         ; fixes shadow acne on thin double-sided geometry
; SKINS = skin_folder_1, skin_folder_2 ; limit this block to specific skins
